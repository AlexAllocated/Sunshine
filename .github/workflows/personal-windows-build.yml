name: Personal Windows capture-only build

on:
  push:
    branches: [codex/windows-external-audio-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/ci-windows.yml
    with:
      publish_release: 'false'
      release_commit: ${{ github.sha }}
      release_version: '2026.908.1'
